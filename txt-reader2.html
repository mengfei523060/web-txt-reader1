<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TXT 阅读器</title>
<style>
  :root {
    --bg: #f7f3ea;
    --panel: #ffffff;
    --text: #2c2c2c;
    --accent: #a0632a;
    --accent-soft: #f0e2d0;
    --border: #e5ddd0;
    --shadow: rgba(0, 0, 0, .08);
  }
  [data-theme="dark"] {
    --bg: #1e2126;
    --panel: #262a31;
    --text: #d8d8d8;
    --accent: #e0a860;
    --accent-soft: #3a3325;
    --border: #3a3f47;
    --shadow: rgba(0, 0, 0, .4);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Source Han Sans SC", sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
  }

  /* ---------- 顶栏 ---------- */
  header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
    box-shadow: 0 2px 8px var(--shadow);
    z-index: 10;
  }
  header .title { font-weight: 700; font-size: 16px; margin-right: 6px; white-space: nowrap; }
  header .file-name { font-size: 13px; color: var(--accent); max-width: 30vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  header .spacer { flex: 1; }
  header button, header select, header label.btn {
    font-size: 13px;
    padding: 6px 12px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    border-radius: 8px;
    cursor: pointer;
    transition: background .15s;
    white-space: nowrap;
  }
  header button:hover, header label.btn:hover { background: var(--accent-soft); }
  header .group {
    display: flex; align-items: center; gap: 6px;
    padding: 3px 8px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 13px;
  }
  header .group input[type="range"] { width: 90px; accent-color: var(--accent); }

  /* ---------- 主区域 ---------- */
  main {
    flex: 1;
    display: flex;
    justify-content: center;
    padding: 24px 16px 8px;
    overflow: hidden;
  }
  #page {
    width: min(760px, 100%);
    max-height: 100%;
    overflow-y: auto;
    padding: 40px 44px;
    background: var(--panel);
    border-radius: 14px;
    box-shadow: 0 8px 30px var(--shadow);
    font-size: 18px;
    line-height: 1.9;
    text-align: justify;
    white-space: pre-wrap;
    word-break: break-word;
    transition: opacity .18s ease, transform .18s ease;
  }
  #page.turn-left  { opacity: 0; transform: translateX(-18px); }
  #page.turn-right { opacity: 0; transform: translateX(18px); }

  #placeholder {
    text-align: center;
    color: var(--text);
    opacity: .55;
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    user-select: none;
  }
  #placeholder .icon { font-size: 60px; }
  #placeholder .tip { font-size: 14px; line-height: 1.8; }
  #placeholder .tip kbd {
    background: var(--accent-soft);
    border-radius: 5px;
    padding: 1px 7px;
    font-size: 12px;
    border: 1px solid var(--border);
  }
  body.empty #placeholder { display: flex; }
  body.empty #page { display: none; }

  /* 拖拽提示 */
  #dropMask {
    position: fixed;
    inset: 0;
    background: color-mix(in srgb, var(--accent) 15%, transparent);
    border: 3px dashed var(--accent);
    display: none;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    color: var(--accent);
    z-index: 99;
    pointer-events: none;
  }
  body.dragging #dropMask { display: flex; }

  /* ---------- 底栏 ---------- */
  footer {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px 14px;
  }
  footer .nav {
    font-size: 15px;
    padding: 8px 18px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    border-radius: 10px;
    cursor: pointer;
    box-shadow: 0 2px 6px var(--shadow);
    transition: transform .1s, background .15s;
  }
  footer .nav:hover:not(:disabled) { background: var(--accent-soft); transform: translateY(-1px); }
  footer .nav:disabled { opacity: .35; cursor: not-allowed; }
  footer .progress-wrap { flex: 1; display: flex; flex-direction: column; gap: 4px; }
  footer .bar {
    height: 6px;
    background: var(--border);
    border-radius: 3px;
    overflow: hidden;
    cursor: pointer;
  }
  footer .bar > div {
    height: 100%;
    width: 0;
    background: var(--accent);
    border-radius: 3px;
    transition: width .25s ease;
  }
  footer .info {
    font-size: 13px;
    display: flex;
    justify-content: space-between;
    gap: 12px;
  }
  footer .jump {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 13px;
  }
  footer .jump input {
    width: 52px;
    padding: 4px 6px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--panel);
    color: var(--text);
    text-align: center;
    font-size: 13px;
  }
  footer .auto {
    font-size: 13px;
    padding: 6px 10px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    border-radius: 8px;
    cursor: pointer;
  }
  footer .auto.on { background: var(--accent); color: #fff; border-color: var(--accent); }

  /* ---------- 书签面板 ---------- */
  #bmBtn .badge {
    display: inline-block;
    min-width: 16px;
    padding: 0 4px;
    margin-left: 4px;
    background: var(--accent);
    color: #fff;
    border-radius: 8px;
    font-size: 11px;
    line-height: 16px;
    text-align: center;
  }
  .bm-panel {
    position: fixed;
    top: 60px;
    right: 12px;
    width: min(340px, calc(100vw - 24px));
    max-height: 62vh;
    display: flex;
    flex-direction: column;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: 0 10px 30px var(--shadow);
    z-index: 50;
    overflow: hidden;
  }
  .bm-panel[hidden] { display: none; }
  .bm-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 14px;
    font-size: 14px;
    font-weight: 700;
    border-bottom: 1px solid var(--border);
  }
  .bm-head button {
    font-size: 12px;
    padding: 4px 10px;
    border: 1px solid var(--border);
    background: none;
    color: var(--text);
    border-radius: 6px;
    cursor: pointer;
  }
  .bm-head button:hover { background: var(--accent-soft); }
  .bm-add {
    margin: 10px 14px 4px;
    padding: 8px;
    font-size: 13px;
    border: 1px dashed var(--accent);
    background: var(--accent-soft);
    color: var(--accent);
    border-radius: 8px;
    cursor: pointer;
  }
  .bm-add:hover { opacity: .85; }
  .bm-list { overflow-y: auto; padding: 8px 14px 12px; }
  .bm-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
  }
  .bm-item:hover, .bm-item.cur { background: var(--accent-soft); }
  .bm-item .pg { color: var(--accent); white-space: nowrap; font-size: 12px; font-weight: 700; }
  .bm-item .lbl { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bm-item .tm { color: var(--text); opacity: .45; font-size: 11px; white-space: nowrap; }
  .bm-item .del {
    border: none; background: none;
    color: var(--text); opacity: .4;
    cursor: pointer; font-size: 14px; line-height: 1;
  }
  .bm-item .del:hover { opacity: 1; }
  .bm-empty { text-align: center; opacity: .5; font-size: 13px; padding: 16px 0; }
  #toast {
    position: fixed;
    top: 64px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--accent);
    color: #fff;
    padding: 8px 18px;
    border-radius: 20px;
    font-size: 13px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s;
    z-index: 60;
  }
  #toast.show { opacity: 1; }

  @media (max-width: 640px) {
    #page { padding: 24px 18px; }
    header .file-name { display: none; }
  }
</style>
</head>
<body class="empty">

<div id="dropMask">松开以打开 TXT 文件</div>

<header>
  <span class="title">📖 TXT 阅读器</span>
  <label class="btn">打开文件<input id="fileInput" type="file" accept=".txt,text/plain" hidden></label>
  <span class="file-name" id="fileName">未加载文件</span>
  <button id="bmBtn" title="书签（快捷键 B）">🔖 书签<span class="badge" id="bmCount"></span></button>
  <span class="spacer"></span>
  <div class="group">🔤<input id="fontRange" type="range" min="14" max="30" value="18"></div>
  <div class="group">⏱ 自动翻页<select id="autoSelect">
      <option value="0">关闭</option>
      <option value="3">3 秒</option>
      <option value="5">5 秒</option>
      <option value="10">10 秒</option>
      <option value="20">20 秒</option>
    </select>
  </div>
  <button id="themeBtn" title="切换主题">🌙</button>
</header>

<div id="bmPanel" class="bm-panel" hidden>
  <div class="bm-head">
    <span>🔖 书签列表</span>
    <button id="bmClear">清空</button>
  </div>
  <button id="bmAdd" class="bm-add">＋ 添加当前页书签</button>
  <div id="bmList" class="bm-list"></div>
</div>

<div id="toast"></div>

<main>
  <div id="page"></div>
  <div id="placeholder">
    <div class="icon">📄</div>
    <div class="tip">
      点击「打开文件」选择本地 TXT 文件，<br>
      或将 .txt 文件直接拖入页面<br><br>
      快捷键：<kbd>←</kbd><kbd>→</kbd> 翻页 &nbsp;
      <kbd>Home</kbd>/<kbd>End</kbd> 首末页 &nbsp;
      <kbd>↑</kbd><kbd>↓</kbd> 字体大小 &nbsp;
      <kbd>B</kbd> 加入书签
    </div>
  </div>
</main>

<footer>
  <button class="nav" id="prevBtn">⬅ 上一页</button>
  <div class="progress-wrap">
    <div class="bar" id="bar"><div id="barInner"></div></div>
    <div class="info">
      <span id="pageInfo">第 0 / 0 页</span>
      <span class="jump">
        跳转 <input id="jumpInput" type="number" min="1" value="1"> 页
        <button class="nav" id="jumpBtn" style="padding:4px 10px;font-size:12px;">GO</button>
      </span>
    </div>
  </div>
  <button class="auto" id="autoBtn" title="暂停/继续自动翻页">⏸ 自动</button>
  <button class="nav" id="nextBtn">下一页 ➡</button>
</footer>

<script>
(() => {
  "use strict";

  const CHARS_PER_PAGE = 700;          // 每页约字符数（按行边界切分）
  let pages = [];                      // 分页后的字符串数组
  let cur = 0;                         // 当前页码（0 基）
  let fileName = "";
  let autoTimer = null;
  let autoPaused = false;
  let bms = [];                 // 当前文件的书签
  let bmKey = "", posKey = "";  // localStorage 键

  const $ = id => document.getElementById(id);
  const pageEl = $("page");

  /* ---------------- 书签 ---------------- */
  function toast(msg) {
    const t = $("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(t._h);
    t._h = setTimeout(() => t.classList.remove("show"), 1800);
  }
  function bmStore(name, size) {
    bmKey = "txtReader.bm." + name + "." + size;
    posKey = "txtReader.pos." + name + "." + size;
    try { bms = JSON.parse(localStorage.getItem(bmKey) || "[]"); }
    catch (e) { bms = []; }
    updateBmBtn();
  }
  function saveBm() {
    try { localStorage.setItem(bmKey, JSON.stringify(bms)); } catch (e) {}
    updateBmBtn();
    if (!$("bmPanel").hidden) renderBmList();
  }
  function updateBmBtn() {
    $("bmCount").textContent = bms.length || "";
  }
  function pageSnippet(p) {
    const s = (pages[p] || "").replace(/\s+/g, " ").trim();
    return (s.slice(0, 12) + (s.length > 12 ? "…" : "")) || "（空白页）";
  }
  function addBookmark() {
    if (!pages.length) return;
    if (bms.some(b => b.page === cur + 1)) { toast("当前页已加入书签"); return; }
    bms.push({ page: cur + 1, label: pageSnippet(cur), time: Date.now() });
    bms.sort((a, b) => a.page - b.page);
    saveBm();
    toast("已加入书签：第 " + (cur + 1) + " 页");
  }
  function renderBmList() {
    const list = $("bmList");
    list.innerHTML = "";
    if (!bms.length) {
      list.innerHTML = '<div class="bm-empty">暂无书签，先加入书签吧</div>';
      return;
    }
    for (const b of bms) {
      const d = new Date(b.time);
      const tm = (d.getMonth() + 1) + "-" + d.getDate() + " " +
        String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
      const row = document.createElement("div");
      row.className = "bm-item" + (b.page === cur + 1 ? " cur" : "");
      row.innerHTML =
        '<span class="pg">P' + b.page + "</span>" +
        '<span class="lbl"></span>' +
        '<span class="tm">' + tm + "</span>" +
        '<button class="del" title="删除">×</button>';
      row.querySelector(".lbl").textContent = b.label;
      row.querySelector(".del").addEventListener("click", e => {
        e.stopPropagation();
        bms = bms.filter(x => x !== b);
        saveBm();
      });
      row.addEventListener("click", () => { closeBm(); jumpTo(b.page); });
      list.appendChild(row);
    }
  }
  function openBm() { $("bmPanel").hidden = false; renderBmList(); }
  function closeBm() { $("bmPanel").hidden = true; }

  /* ---------------- 加载文件 ---------------- */
  function loadFile(file) {
    if (!file) return;
    if (!/\.txt$/i.test(file.name) && file.type !== "text/plain") {
      if (!confirm("所选文件不是 .txt，仍要尝试打开吗？")) return;
    }
    const reader = new FileReader();
    reader.onload = e => {
      fileName = file.name;
      $("fileName").textContent = file.name;
      bmStore(file.name, file.size);
      paginate(e.target.result || "");
      document.body.classList.remove("empty");
      // 恢复上次阅读位置
      const saved = Number(localStorage.getItem(posKey));
      if (saved >= 1 && saved <= pages.length) {
        cur = saved - 1;
        render(true);
        toast("已恢复到上次阅读位置（第 " + (cur + 1) + " 页）");
      }
    };
    reader.onerror = () => alert("读取文件失败，请重试。");
    reader.readAsText(file, "utf-8");
  }

  /* ---------------- 分页算法：按行边界切分 ---------------- */
  function paginate(text) {
    text = text.replace(/\r\n?/g, "\n").replace(/\uFEFF/g, "");
    const lines = text.split("\n");
    pages = [];
    let buf = "", count = 0;
    for (let i = 0; i < lines.length; i++) {
      const line = lines[i];
      // 单行超长时强制按字符数截断
      if (line.length > CHARS_PER_PAGE) {
        if (buf) { pages.push(buf); buf = ""; count = 0; }
        for (let s = 0; s < line.length; s += CHARS_PER_PAGE)
          pages.push(line.slice(s, s + CHARS_PER_PAGE));
        continue;
      }
      if (count + line.length + 1 > CHARS_PER_PAGE && buf) {
        pages.push(buf);
        buf = "";
        count = 0;
      }
      buf += (buf ? "\n" : "") + line;
      count += line.length + 1;
    }
    if (buf) pages.push(buf);
    if (!pages.length) pages = ["（空文件）"];
    cur = 0;
    render(true);
  }

  /* ---------------- 渲染 ---------------- */
  function render(reset) {
    pageEl.textContent = pages[cur];
    const total = pages.length;
    $("pageInfo").textContent = `第 ${cur + 1} / ${total} 页`;
    $("barInner").style.width = ((cur + 1) / total * 100) + "%";
    $("jumpInput").value = cur + 1;
    $("jumpInput").max = total;
    $("prevBtn").disabled = cur <= 0;
    $("nextBtn").disabled = cur >= total - 1;
    try { localStorage.setItem(posKey, String(cur + 1)); } catch (e) {}
    if (reset) pageEl.scrollTop = 0;
    resetAutoTimer();
  }

  function go(delta) {
    if (!pages.length) return;
    const next = cur + delta;
    if (next < 0 || next >= pages.length) {
      if (delta > 0 && autoTimer) stopAuto();   // 到末页自动停
      return;
    }
    pageEl.classList.remove("turn-left", "turn-right");
    void pageEl.offsetWidth;                    // 强制重排以重启动画
    pageEl.classList.add(delta > 0 ? "turn-left" : "turn-right");
    setTimeout(() => {
      cur = next;
      render();
      requestAnimationFrame(() => pageEl.classList.remove("turn-left", "turn-right"));
    }, 120);
  }

  function jumpTo(n) {
    n = Math.floor(Number(n));
    if (!pages.length || !isFinite(n)) return;
    n = Math.min(Math.max(1, n), pages.length);
    if (n === cur + 1) return;
    go(n - 1 - cur);
  }

  /* ---------------- 自动翻页 ---------------- */
  function resetAutoTimer() {
    stopAuto(false);
    const sec = Number($("autoSelect").value);
    if (!sec || autoPaused || cur >= pages.length - 1) return;
    autoTimer = setInterval(() => go(1), sec * 1000);
    setAutoBtn();
  }
  function stopAuto(rerender = true) {
    if (autoTimer) { clearInterval(autoTimer); autoTimer = null; }
    if (rerender) setAutoBtn();
  }
  function setAutoBtn() {
    const on = !!autoTimer;
    $("autoBtn").classList.toggle("on", on);
    $("autoBtn").textContent = on ? "⏸ 自动" : "▶ 自动";
  }

  /* ---------------- 事件绑定 ---------------- */
  $("fileInput").addEventListener("change", e => loadFile(e.target.files[0]));
  $("prevBtn").addEventListener("click", () => { autoPaused = true; go(-1); });
  $("nextBtn").addEventListener("click", () => { autoPaused = true; go(1); });
  $("jumpBtn").addEventListener("click", () => { autoPaused = true; jumpTo($("jumpInput").value); });
  $("jumpInput").addEventListener("keydown", e => {
    if (e.key === "Enter") { e.preventDefault(); autoPaused = true; jumpTo(e.target.value); }
  });
  $("autoSelect").addEventListener("change", () => { autoPaused = false; resetAutoTimer(); });
  $("autoBtn").addEventListener("click", () => {
    if (autoTimer) { autoPaused = true; stopAuto(); }
    else { autoPaused = false; resetAutoTimer(); }
  });
  $("fontRange").addEventListener("input", e => pageEl.style.fontSize = e.target.value + "px");
  $("bar").addEventListener("click", e => {
    const r = e.currentTarget.getBoundingClientRect();
    jumpTo(Math.max(1, Math.round((e.clientX - r.left) / r.width * pages.length)));
  });
  $("themeBtn").addEventListener("click", () => {
    const dark = document.documentElement.dataset.theme === "dark";
    document.documentElement.dataset.theme = dark ? "" : "dark";
    $("themeBtn").textContent = dark ? "🌙" : "☀️";
  });

  // 书签
  $("bmBtn").addEventListener("click", () =>
    $("bmPanel").hidden ? openBm() : closeBm());
  $("bmAdd").addEventListener("click", addBookmark);
  $("bmClear").addEventListener("click", () => {
    if (!bms.length) return;
    if (confirm("确定清空该文件的全部书签？")) { bms = []; saveBm(); }
  });
  document.addEventListener("click", e => {
    if (!$("bmPanel").hidden &&
        !e.target.closest("#bmPanel") && !e.target.closest("#bmBtn")) closeBm();
  });

  // 键盘翻页
  document.addEventListener("keydown", e => {
    if (e.target.tagName === "INPUT" && e.target.type !== "number") return;
    if (e.target === $("jumpInput") && e.key === "Enter") return;
    if (e.key === "b" || e.key === "B") { addBookmark(); return; }
    autoPaused = true;
    switch (e.key) {
      case "ArrowRight": case "PageDown": case " ": go(1);  break;
      case "ArrowLeft":  case "PageUp":             go(-1); break;
      case "Home": jumpTo(1); break;
      case "End":  jumpTo(pages.length); break;
      case "ArrowUp":   $("fontRange").value = Math.max(14, +$("fontRange").value - 1);
                        pageEl.style.fontSize = $("fontRange").value + "px"; break;
      case "ArrowDown": $("fontRange").value = Math.min(30, +$("fontRange").value + 1);
                        pageEl.style.fontSize = $("fontRange").value + "px"; break;
    }
    if (autoPaused) resetAutoTimer();
  });

  // 触摸滑动翻页
  let touchX = 0;
  document.addEventListener("touchstart", e => touchX = e.touches[0].clientX, { passive: true });
  document.addEventListener("touchend", e => {
    const dx = e.changedTouches[0].clientX - touchX;
    if (Math.abs(dx) > 60) go(dx < 0 ? 1 : -1);
  }, { passive: true });

  // 拖拽打开
  ["dragover", "drop"].forEach(ev => window.addEventListener(ev, e => e.preventDefault()));
  window.addEventListener("dragover", () => document.body.classList.add("dragging"));
  window.addEventListener("dragleave", e => { if (!e.relatedTarget) document.body.classList.remove("dragging"); });
  window.addEventListener("drop", e => {
    document.body.classList.remove("dragging");
    const f = e.dataTransfer.files[0];
    if (f) loadFile(f);
  });
})();
</script>
</body>
</html>
